<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Ground Line -->
  <line x1="50" y1="180" x2="850" y2="180" stroke="#475569" stroke-width="3" stroke-dasharray="12 8" />

  <!-- Pixel Dino Icon -->
  <g transform="translate(90, 75)" filter="url(#glow)">
    <rect x="25" y="0" width="25" height="25" fill="#10b981" rx="4"/>
    <rect x="15" y="25" width="45" height="30" fill="#10b981" rx="4"/>
    <rect x="20" y="55" width="10" height="25" fill="#10b981" rx="2"/>
    <rect x="40" y="55" width="10" height="25" fill="#10b981" rx="2"/>
    <circle cx="42" cy="10" r="4" fill="#0f172a" />
    <path d="M 15 35 Q 0 45 5 25" stroke="#10b981" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cacti Obstacles -->
  <g transform="translate(680, 120)">
    <rect x="0" y="10" width="12" height="50" fill="#f43f5e" rx="3"/>
    <rect x="-8" y="22" width="8" height="15" fill="#f43f5e" rx="2"/>
    <rect x="12" y="18" width="8" height="18" fill="#f43f5e" rx="2"/>
  </g>
  <g transform="translate(730, 105)">
    <rect x="0" y="10" width="14" height="65" fill="#f43f5e" rx="3"/>
    <rect x="-10" y="25" width="10" height="20" fill="#f43f5e" rx="2"/>
    <rect x="14" y="20" width="10" height="24" fill="#f43f5e" rx="2"/>
  </g>

  <!-- Pterodactyl Bird -->
  <g transform="translate(560, 60)">
    <path d="M 0 15 Q 15 0 30 15 Q 45 0 60 15 Q 30 25 0 15 Z" fill="#38bdf8"/>
    <polygon points="60,15 75,18 60,22" fill="#38bdf8"/>
  </g>

  <!-- Title & Typography -->
  <text x="210" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="1.5">
    DINOSOUR
  </text>
  <text x="210" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    Retro Canvas Runner Game · React 18 · TypeScript · Vite · Tailwind CSS
  </text>

  <!-- Feature Tags -->
  <g transform="translate(210, 160)">
    <rect x="0" y="0" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="52" y="16" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="600" text-anchor="middle">60 FPS LOOP</text>

    <rect x="115" y="0" width="115" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="172" y="16" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="middle">AABB PHYSICS</text>

    <rect x="240" y="0" width="125" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="302" y="16" font-family="sans-serif" font-size="11" fill="#a855f7" font-weight="600" text-anchor="middle">LEADERBOARDS</text>

    <rect x="375" y="0" width="135" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="442" y="16" font-family="sans-serif" font-size="11" fill="#f59e0b" font-weight="600" text-anchor="middle">LOCAL FALLBACK</text>
  </g>
</svg>
